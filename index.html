<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduPro</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/main.css">
</head>
<body>

<!-- HEADER -->
<header class="header">
  <div class="container">
    <div class="logo">EduPro</div>
    <nav>
      <a href="#">Home</a>
      <a href="#course">Courses</a>
      <a href="#testimonial">Reviews</a>
      <a href="#contact">Contact</a>
    </nav>
  </div>
</header>

<!-- HERO -->
<section class="hero">
  <div class="hero-content">
    <h1>Become a Developer</h1>
    <p>Learn from zero to pro</p>
    <button>Start Now</button>
  </div>
</section>

<!-- COURSE -->
<section id="course" class="course">
  <h2>Courses</h2>
  <div class="cards">
    <div class="card">Scratch</div>
    <div class="card">Web</div>
    <div class="card">Game</div>
  </div>
</section>

<!-- TESTIMONIAL -->
<section id="testimonial" class="testimonial">
  <h2>Reviews</h2>
  <div class="reviews">
    <div class="review">"Rất tốt"</div>
    <div class="review">"Học dễ hiểu"</div>
  </div>
</section>

<!-- CONTACT -->
<section id="contact" class="contact">
  <h2>Register</h2>
  <form>
    <input type="text" placeholder="Name">
    <input type="email" placeholder="Email">
    <input type="tel" placeholder="Phone">
    <button>Submit</button>
  </form>
</section>

<!-- FOOTER -->
<footer class="footer">
  <p>© 2026 EduPro</p>
</footer>

<script src="js/main.js"></script>
</body>
</html>
